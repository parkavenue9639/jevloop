<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JevLoop — execution console</title>
    <script>
      // Keep explicit preferences; new visitors start in the console's dark theme.
      try {
        document.documentElement.dataset.theme = localStorage.getItem("jevloop.theme") || "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
