[project]
name = "jevloop"
version = "0.0.1"
description = "A fast-path agent runtime where Jev decides, LLMs write, and deterministic code executes."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["agents", "jev", "llm", "tool-use", "ai"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.27",
    "jsonschema>=4.23",
    "pillow>=11.3",
]

[project.optional-dependencies]
# Installed only with `uv sync --extra ...` inside this project. Not global.
laya-mlx = [
    "laya-mlx>=0.2.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]
laya-cuda = [
    "laya[serve]>=0.3.20",
]

[project.scripts]
jevloop = "jevloop.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jevloop"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
